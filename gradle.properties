# Plugin version (matches the 'version' field in plugin.yml)
pluginVersion=1.0

# ------------------------------------------------------------
#  Paper API version to compile against
# ------------------------------------------------------------
#  - 26.2.build.100-stable   -> the jar you asked for "now" (MC 26.2)
#  - 1.21.4-R0.1-SNAPSHOT    -> compile against the OLDEST supported
#                               version to produce a UNIVERSAL jar
#                               that runs on every MC version 1.21 -> 26.2
#
#  The source only uses stable Bukkit/Paper API, so the SAME code
#  compiles against either version. Switch and rebuild:
#      ./gradlew shadowJar
# ------------------------------------------------------------
paperVersion=1.21.4-R0.1-SNAPSHOT

org.gradle.jvmargs=-Xmx1G
